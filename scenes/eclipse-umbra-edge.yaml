time_days: 0.000277777777777778
camera:
  body: world
  latitude_deg: 0
  longitude_deg: 0
  height_m: 2
  look_at: sun
  direction: {azimuth_deg: 0, altitude_deg: 12}
  fov_deg: 60
  atmosphere: earthlike
  ground: basalt
bodies:

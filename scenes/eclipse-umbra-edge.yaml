    kind: star
    radius_km: 1495.978707
    luminosity: 0.8
  - id: world
    kind: planet
    parent: sun
    radius_km: 6371
    albedo: [0, 0, 0]
    orbit:
      semi_major_axis_au: 1.0000088553104998
      period_days: 365.256
      inclination_deg: 90
      mean_anomaly_deg: -102.00238674218993
